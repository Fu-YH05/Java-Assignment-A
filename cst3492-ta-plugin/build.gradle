plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.6.0'
}

group = 'com.cst3492'
version = '1.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.2.6')
        bundledPlugin('com.intellij.java')
    }
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '242'
            untilBuild = null
        }
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

buildSearchableOptions { enabled = false }
jarSearchableOptions { enabled = false }

tasks.register('evaluateRetrieval', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cst3492.ta.evaluation.RetrievalEvaluation'
    doFirst {
        if (!project.hasProperty('evaluationIndex')) {
            throw new GradleException('Pass -PevaluationIndex=/path/to/local/index')
        }
        args project.property('evaluationIndex'),
                file('src/test/resources/evaluation/queries.tsv').absolutePath,
                layout.buildDirectory.file('reports/evaluation/results.json').get().asFile.absolutePath
    }
}
